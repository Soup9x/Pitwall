[project]
name = "pitwall"
version = "0.1.0"
description = "Self-hosted Formula 1 notifier for the homelab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "apprise>=1.8",
    "icalendar>=6.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "pillow>=10",
    "feedparser>=6.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21", "time-machine>=2.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pitwall*"]

[tool.setuptools.package-data]
pitwall = [
    "web/templates/*.html",
    "web/templates/*.svg",
    "web/templates/email/*",
    "web/static/*",
    "web/static/vendor/*",
    "web/static/fonts/*",
    "web/static/icons/*",
    "migrations/script.py.mako",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"pitwall/migrations/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
