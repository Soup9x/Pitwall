# Developer convenience: `alembic revision --autogenerate -m "..."`.
# At runtime migrations are applied by `python -m pitwall migrate` (run automatically on start).
[alembic]
script_location = pitwall/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
