# Curated circuit facts that the APIs don't provide.
#
# Keys are Jolpica/Ergast circuitIds (e.g. "albert_park"). Pitwall merges these values into the
# circuit table on every schedule sync, so edits here take effect within 6 hours (or on restart).
#
# IMPORTANT: these values were compiled without live verification and every entry is marked
# `verified: false`. Please spot-check them against formula1.com and flip `verified` to true.
# Anything we were not sure about is left as null on purpose: Pitwall hides missing fields
# rather than showing a guess.
#
# Notes:
#   - timezone: IANA zone of the circuit, used for "track-local" times.
#   - drs_zones: the DRS-era count (2025). The 2026 regulations replace DRS with active aero /
#     overtake mode, so treat this as historical context.
#   - lap_record: the official *race* lap record (set during a Grand Prix, not qualifying).
#     Left null where a 2025 race may have lowered it.
#   - map_image: an https:// URL or a path relative to the data directory (e.g. maps/monza.png).
#   - madring: the circuitId for the new Madrid circuit is assumed to be "madring"; if the
#     Jolpica schedule uses a different id, rename the key.

