<table role="presentation" width="100%" cellpadding="4" cellspacing="0" border="0" style="border-collapse:collapse;font-size:14px;margin-bottom:12px;">
<tr style="background:#EEF0F4;text-align:left;color:#535B68;font-size:12px;text-transform:uppercase;"><th align="right">#</th><th align="left">{{ heading }}</th><th align="right">Pts</th><th align="right">Gap</th><th align="center">±</th></tr>
{% for r in rows %}
<tr style="border-bottom:1px solid #D9DDE5;{% if r.followed %}background:#FEF9C3;{% endif %}">
  <td align="right" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;">{{ r.position }}</td>
  <td style="border-left:4px solid {{ r.team_color or '#D9DDE5' }};padding-left:8px;">{{ r.name }}{% if r.followed %} ★{% endif %}{% if r.team %} <span style="color:#535B68;">{{ r.team }}</span>{% endif %}</td>
  <td align="right" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;">{{ r.points|pts }}</td>
  <td align="right" style="color:#535B68;font-family:'JetBrains Mono',Menlo,Consolas,monospace;">{% if r.gap_leader %}-{{ r.gap_leader|pts }}{% else %}—{% endif %}</td>
  <td align="center" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;color:{% if r.change and r.change > 0 %}#166534{% elif r.change and r.change < 0 %}#B91C1C{% else %}#535B68{% endif %};">{{ r.arrow }}</td>
</tr>
{% endfor %}
</table>
